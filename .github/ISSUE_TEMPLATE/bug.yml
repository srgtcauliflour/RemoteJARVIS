name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/device/component/version. Do not include secrets.
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized logs
      description: Remove tokens, keys, private addresses, and personal data.
